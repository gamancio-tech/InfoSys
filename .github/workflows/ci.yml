name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varredura de segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shared:
    name: Shared (Lint, Typecheck e Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (.node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup Bun (packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar workspaces
        run: bun install --frozen-lockfile

      - name: Verificar formatação (Prettier)
        run: bun run format:check

      - name: Build @infosys/shared
        run: bun run build:shared

      - name: Lint @infosys/shared
        run: bun run --cwd packages/shared lint

      - name: Typecheck @infosys/shared
        run: bun run --cwd packages/shared typecheck

  api:
    name: API (Lint, Typecheck, Testes e Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infosys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infosys_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/infosys_test?schema=public
      BETTER_AUTH_SECRET: ci-test-only-secret-key-with-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (.node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup Bun (packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar workspaces
        run: bun install --frozen-lockfile

      - name: Build @infosys/shared
        run: bun run build:shared

      - name: Lint (Oxlint type-aware)
        run: bun run --cwd apps/api lint

      - name: Typecheck (TypeScript)
        run: bun run --cwd apps/api typecheck

      - name: Testes unitários (Jest)
        run: bun run --cwd apps/api test

      - name: Testes de integração / E2E (Jest)
        run: bun run --cwd apps/api test:e2e

      - name: Build de produção
        run: bun run --cwd apps/api build

  web:
    name: Web (Lint, Typecheck, Testes e Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_API_URL: /v1

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (.node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup Bun (packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar workspaces
        run: bun install --frozen-lockfile

      - name: Build @infosys/shared
        run: bun run build:shared

      - name: Lint (Oxlint type-aware)
        run: bun run --cwd apps/web lint

      - name: Typecheck (TypeScript)
        run: bun run --cwd apps/web typecheck

      - name: Testes unitários (Vitest)
        run: bun run --cwd apps/web test

      - name: Build de produção (Vite + PWA)
        run: bun run --cwd apps/web build
